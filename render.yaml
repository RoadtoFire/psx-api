services:
  - type: web
    name: psx-api
    runtime: python
    pythonVersion: "3.13.2"
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://amanat-psx.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: psx-db
          property: connectionString
      - key: REDIS_URL
        sync: false  # paste your Upstash URL in the Render dashboard

  - type: worker
    name: psx-celery
    runtime: python
    pythonVersion: "3.13.2"
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: SECRET_KEY
        fromService:
          name: psx-api
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: psx-db
          property: connectionString
      - key: REDIS_URL
        sync: false  # paste your Upstash URL in the Render dashboard

databases:
  - name: psx-db
    databaseName: psx_api
    user: psx_owner
    plan: free

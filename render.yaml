services:
  - type: web
    name: psx-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://amanat-psx.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: psx-db
          property: connectionString

databases:
  - name: psx-db
    databaseName: psx_api
    user: psx_owner
    plan: free
